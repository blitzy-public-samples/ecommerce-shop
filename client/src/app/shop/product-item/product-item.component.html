<div class="card h-100 box-shadow">
  <div class="image position-relative" style="cursor: pointer;">
    <img src="{{product.pictureUrl}}" alt="{{product.name}}" class="img-fluid bg-secondary">
    <div class="d-flex align-items-center justify-content-center hover-overlay">
      <button (click) = "addItemToBasket()" [disabled]="stock === 0" type="button" aria-label="Add to cart" class="btn btn-primary fa fa-shopping-cart mr-2"></button>
      <button routerLink="/shop/{{product.id}}"type="button" class="btn btn-primary">View</button>
    </div>
  </div>
  <div class="card-body d-flex flex-column">
    <a routerLink="/shop/{{product.id}}">
      <h6 class="text-uppercase">{{product.name}}</h6>
    </a>
    <span class="mb-2">{{product.price | currency}}</span>
    <span *ngIf="stock > 0 && stock <= 5" class="badge badge-warning" role="status" aria-live="polite">Only {{stock}} left!</span>
    <span *ngIf="stock === 0" class="badge badge-danger" role="status" aria-live="polite">Out of stock</span>
  </div>
</div>
