<span *ngIf="!isOutOfStock" [class.text-danger]="isLowStock" [class.text-success]="!isLowStock">{{ quantityAvailable }} in stock</span>
<span *ngIf="isLowStock" class="text-danger d-block small">Only {{ quantityAvailable }} left!</span>
<span *ngIf="isOutOfStock" class="text-danger">Out of stock</span>
