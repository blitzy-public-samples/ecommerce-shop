<ng-container *ngIf="items.length > 0">
  <div class="table-responsive">
    <table class="table table-borderless">
      <thead [class.thead-light]="isBasket || isOrder" class="border-0 py-2">
      <tr>
        <th scope="col">
          <div class="p-2 px-3 text-uppercase">Product</div>
        </th>
        <th scope="col">
          <div class="py-2 text-uppercase">Price</div>
        </th>
        <th scope="col">
          <div class="py-2 text-uppercase">Quantity</div>
        </th>
        <th scope="col">
          <div class="py-2 text-uppercase">Total</div>
        </th>
        <th *ngIf="isBasket" scope="col" class="border-0 bg-light">
          <div class="py-2 text-uppercase">Remove</div>
        </th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let item of items">
        <th scope="row">
          <div class="p-2">
            <img src="{{item.pictureUrl}}" alt="{{item.productName}}" class="img-fluid"
                 style="max-height: 50px;">
            <div class="ml-3 d-inline-block align-middle">
              <h5 class="mb-0">
                <a routerLink="/shop/{{item.id || item.productId}}" class="text-dark">{{item.productName}}</a>
                <span class="text-muted font-weight-normal font-italic d-block"
                *ngIf="item.type">Type: {{item.type}}</span>
              </h5>
            </div>
          </div>
        </th>
        <td class="align-middle"><strong>{{item.price | currency}}</strong>
        </td>
        <td class="align-middle">
          <div class="d-flex align-items center" [class.justify-content-center]="!isBasket">
            <!-- QA F7: real <button>s (keyboard-operable + accessible name) replace
                 the mouse-only, tabindex-excluded <i> icons. The icon is decorative
                 (aria-hidden); the button carries the accessible name. -->
            <button *ngIf="isBasket" type="button" (click)="decrementItemQuantity(item)"
                    class="btn btn-link p-0 border-0 text-warning mr-2 quantity-control"
                    aria-label="Decrease quantity">
              <i class="fa fa-minus-circle" style="font-size: 2em" aria-hidden="true"></i>
            </button>
            <span class="font-weight-bold" style="font-size: 1.5em;">{{item.quantity}}</span>
            <button *ngIf="isBasket" type="button" (click)="incrementItemQuantity(item)"
                    class="btn btn-link p-0 border-0 text-warning mx-2 quantity-control"
                    aria-label="Increase quantity">
              <i class="fa fa-plus-circle" style="font-size: 2em" aria-hidden="true"></i>
            </button>
          </div>
        </td>
        <td class="align-middle"><strong>{{item.price * item.quantity | currency}}</strong>
        </td>
        <td class="align-middle text-center">
          <!-- QA F7: the remove control is the documented gate-recovery path, so it
               MUST be keyboard-operable. A real <button> with a descriptive
               accessible name replaces the mouse-only <i> inside a non-actionable
               <a>. -->
          <button *ngIf="isBasket" type="button" (click)="removeBasketItem(item)"
                  class="btn btn-link p-0 border-0 text-danger quantity-control"
                  [attr.aria-label]="'Remove ' + item.productName + ' from basket'">
            <i class="fa fa-trash" style="font-size: 2em" aria-hidden="true"></i>
          </button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</ng-container>
